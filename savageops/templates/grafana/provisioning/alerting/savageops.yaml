apiVersion: 1
contactPoints:
  - orgId: 1
    name: savageops
    receivers:
      - uid: savageops-webhook
        type: webhook
        settings:
          url: http://savageops:8000/api/webhook/grafana
          httpMethod: POST
          authorization_scheme: Bearer
          authorization_credentials: ${WEBHOOK_SECRET:-savageops-secret}
policies:
  - orgId: 1
    receiver: savageops
    group_by: ["alertname", "service"]
    group_wait: 5s
    group_interval: 1m
    repeat_interval: 4h
