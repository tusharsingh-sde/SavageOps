[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "savageops"
version = "0.1.0"
description = "Multi-Agent AI SRE & DevOps Incident Remediation Pipeline"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi==0.162.0",
  "uvicorn[standard]==0.54.0",
  "langgraph==1.2.18",
  "langchain-openai==1.7.3",
  "pydantic==2.14.1",
  "python-dotenv==1.2.4",
  "PyGithub==2.10.0",
  "supabase==2.33.0",
  "httpx==0.28.1",
  "PyJWT==2.15.1",
  "ruff==0.17.3",
  "prometheus-client==0.26.0",
  "langgraph-checkpoint-postgres==3.2.0",
  "psycopg[binary]==3.3.6",
]

[project.scripts]
savageops = "savageops.cli:main"

[tool.setuptools.packages.find]
include = ["savageops*"]

[tool.setuptools.package-data]
savageops = ["fixtures/*", "templates/**/*", "templates/env.example"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = ["E501"]
