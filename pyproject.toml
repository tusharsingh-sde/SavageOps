[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "savageops"
version = "0.1.0"
description = "Multi-Agent AI SRE & DevOps Incident Remediation Pipeline"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.115,<1.0",
  "uvicorn[standard]>=0.30,<1.0",
  "langgraph>=0.2,<2.0",
  "langchain-openai>=0.2,<2.0",
  "pydantic>=2.8,<3.0",
  "python-dotenv>=1.0,<2.0",
  "PyGithub>=2.4,<3.0",
  "supabase>=2.10,<3.0",
  "httpx>=0.27,<1.0",
  "pyjwt>=2.9,<3.0",
  "ruff>=0.8,<1.0",
  "prometheus-client>=0.21,<1.0",
]

[project.scripts]
savageops = "savageops.cli:main"

[tool.setuptools.packages.find]
include = ["savageops*"]

[tool.setuptools.package-data]
savageops = ["fixtures/*", "templates/**/*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = ["E501"]
